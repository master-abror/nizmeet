# Dev infra lokal NizMeet (Milestone 0.3). Hanya untuk pengembangan lokal.
# Jalankan lewat `make dev-up` (atau `bash deploy/scripts/dev-up.sh`).
# Kredensial dibaca dari deploy/.env (tidak ter-commit); contoh: deploy/.env.example.
name: nizmeet-dev

services:
  postgres:
    # Versi dipin eksak (Master Plan Bagian 0 butir 10). 18.6 = versi yang
    # dipakai memvalidasi docs/contracts/db/ddl.sql di Milestone C.1.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?isi POSTGRES_DB di deploy/.env}
    ports:
      # Hanya loopback: tidak terbuka ke jaringan lokal.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Image postgres 18+ memakai PGDATA /var/lib/postgresql/18/docker,
      # jadi volume dipasang di /var/lib/postgresql (bukan .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    # Tag dipin eksak (Master Plan Bagian 0 butir 10); diverifikasi 2026-10-27.
    image: redis:8.10.3
    restart: unless-stopped
    ports:
      # Hanya loopback. Tanpa password: khusus dev lokal.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
